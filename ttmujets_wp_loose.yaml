general:
  debug_level: DEBUG # Logger level
  input_filelist_path: "../metadata/filelist.txt" # Path to the metadata relative to fastframes directory
  input_sumweights_path: "../metadata/sum_of_weights.txt" # Path to the metadata relative to fastframes directory
  output_path_histograms: "../output_histograms_muons_jets_loose/" # Path to the output histograms relative to fastframes directory
  output_path_ntuples: "../output_ntuples/" # Path to the output ntuples relative to fastframes directory
  default_sumweights: "NOSYS" # Default sum of weights for the samples. This is used to calculate the scaling to the luminosity.
  default_event_weights: "weight_mc_NOSYS  * weight_mc_fcal_2lep * weight_leptonSF_loose_NOSYS" # Default event weights for the samples. This is used to calculate the scaling to the luminosity.
  default_reco_tree_name: "reco" # Name of the reco tree in the input files.
  xsection_files: # Location of the cross-section, k-factor, filter-efficiency medatada split per campaign.
    - files: ["/home/danbiajujumiguel/workspace/FFAnalysis/PMGxsecDB_mc23.txt"]
      campaigns: ["mc23e"]
  luminosity: # Luminosity for the campaigns
    mc23e: 0.00163 #
  automatic_systematics: False
  nominal_only: True # Run with/without systematics.
  config_define_after_custom_class: True
  define_custom_columns: # You can define new variables here. Use valid C++ syntax.
    - name: "nJetsR4_NOSYS"
      definition: "jetR4_pt_NOSYS[jetR4_pt_NOSYS >= 25000 && jetR4_select_looseHI_NOSYS==true].size()"
    - name: "jetR4_sort_idx_NOSYS"
      definition: "ROOT::VecOps::Argsort(-jetR4_pt_NOSYS[jetR4_select_looseHI_NOSYS])"
    - name: "jetR4_pt_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(jetR4_pt_NOSYS[jetR4_select_looseHI_NOSYS], jetR4_sort_idx_NOSYS)"
    - name: "jetR4_eta_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(jetR4_eta[jetR4_select_looseHI_NOSYS], jetR4_sort_idx_NOSYS)"
    - name: "jetR4_phi_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(jetR4_phi[jetR4_select_looseHI_NOSYS], jetR4_sort_idx_NOSYS)"
    - name: "jetR4_e_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(jetR4_e_NOSYS[jetR4_select_looseHI_NOSYS], jetR4_sort_idx_NOSYS)"
    - name: "jetR4_tlv0_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(jetR4_pt_sorted_NOSYS[0], jetR4_eta_sorted_NOSYS[0], jetR4_phi_sorted_NOSYS[0], jetR4_e_sorted_NOSYS[0])"
    - name: "jetR4_tlv1_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(jetR4_pt_sorted_NOSYS[1], jetR4_eta_sorted_NOSYS[1], jetR4_phi_sorted_NOSYS[1], jetR4_e_sorted_NOSYS[1])"
    - name: "jetR4_tlv2_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(jetR4_pt_sorted_NOSYS[2], jetR4_eta_sorted_NOSYS[2], jetR4_phi_sorted_NOSYS[2], jetR4_e_sorted_NOSYS[2])"
    - name: "jetR4_tlv3_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(jetR4_pt_sorted_NOSYS[3], jetR4_eta_sorted_NOSYS[3], jetR4_phi_sorted_NOSYS[3], jetR4_e_sorted_NOSYS[3])"
    - name: "mjj01_NOSYS"
      definition: "(jetR4_tlv0_NOSYS + jetR4_tlv1_NOSYS).M()/1000.0"
    - name: "mjj02_NOSYS"
      definition: "(jetR4_tlv0_NOSYS + jetR4_tlv2_NOSYS).M()/1000.0"
    - name: "mjj03_NOSYS"
      definition: "(jetR4_tlv0_NOSYS + jetR4_tlv3_NOSYS).M()/1000.0"
    - name: "mjj12_NOSYS"
      definition: "(jetR4_tlv1_NOSYS + jetR4_tlv2_NOSYS).M()/1000.0"
    - name: "mjj13_NOSYS"
      definition: "(jetR4_tlv1_NOSYS + jetR4_tlv3_NOSYS).M()/1000.0"
    - name: "mjj23_NOSYS"
      definition: "(jetR4_tlv2_NOSYS + jetR4_tlv3_NOSYS).M()/1000.0"
    - name: "dmjj01_NOSYS"
      definition: "abs(mjj01_NOSYS - 80.4)"
    - name: "dmjj02_NOSYS"
      definition: "abs(mjj02_NOSYS - 80.4)"
    - name: "dmjj03_NOSYS"
      definition: "abs(mjj03_NOSYS - 80.4)"
    - name: "dmjj12_NOSYS"
      definition: "abs(mjj12_NOSYS - 80.4)"
    - name: "dmjj13_NOSYS"
      definition: "abs(mjj13_NOSYS - 80.4)"
    - name: "dmjj23_NOSYS"
      definition: "abs(mjj23_NOSYS - 80.4)"
    - name: "mjj_wcand_best4_NOSYS"
      definition: "(dmjj01_NOSYS <= dmjj02_NOSYS && dmjj01_NOSYS <= dmjj03_NOSYS && dmjj01_NOSYS <= dmjj12_NOSYS && dmjj01_NOSYS <= dmjj13_NOSYS && dmjj01_NOSYS <= dmjj23_NOSYS) ? mjj01_NOSYS : ((dmjj02_NOSYS <= dmjj03_NOSYS && dmjj02_NOSYS <= dmjj12_NOSYS && dmjj02_NOSYS <= dmjj13_NOSYS && dmjj02_NOSYS <= dmjj23_NOSYS) ? mjj02_NOSYS : ((dmjj03_NOSYS <= dmjj12_NOSYS && dmjj03_NOSYS <= dmjj13_NOSYS && dmjj03_NOSYS <= dmjj23_NOSYS) ? mjj03_NOSYS : ((dmjj12_NOSYS <= dmjj13_NOSYS && dmjj12_NOSYS <= dmjj23_NOSYS) ? mjj12_NOSYS : ((dmjj13_NOSYS <= dmjj23_NOSYS) ? mjj13_NOSYS : mjj23_NOSYS))) )"
    - name: "mjj_wcand_best4_absdiff_NOSYS"
      definition: "abs(mjj_wcand_best4_NOSYS - 80.4)"
    - name: "nMuons_NOSYS"
      definition: "mu_pt_NOSYS[mu_pt_NOSYS >= 18000 && mu_select_medium_NOSYS==true].size()"
    - name: "mu_sort_idx_NOSYS"
      definition: "ROOT::VecOps::Argsort(-mu_pt_NOSYS[mu_select_medium_NOSYS])"
    - name: "mu_pt_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(mu_pt_NOSYS[mu_select_medium_NOSYS], mu_sort_idx_NOSYS)"
    - name: "mu_eta_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(mu_eta[mu_select_medium_NOSYS], mu_sort_idx_NOSYS)"
    - name: "mu_phi_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(mu_phi[mu_select_medium_NOSYS], mu_sort_idx_NOSYS)"
    - name: "mu_e_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(mu_e_NOSYS[mu_select_medium_NOSYS], mu_sort_idx_NOSYS)"
    - name: "mu_charge_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(mu_charge[mu_select_medium_NOSYS], mu_sort_idx_NOSYS)"
    - name: "mu_pt2cone20_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(mu_pt2cone20[mu_select_medium_NOSYS], mu_sort_idx_NOSYS)"
    - name: "mu_topoetcone20_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(mu_topoetcone20[mu_select_medium_NOSYS], mu_sort_idx_NOSYS)"
    - name: "mu0_tlv_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(mu_pt_sorted_NOSYS[0], mu_eta_sorted_NOSYS[0], mu_phi_sorted_NOSYS[0], mu_e_sorted_NOSYS[0])"
    - name: "mu1_tlv_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(mu_pt_sorted_NOSYS[1], mu_eta_sorted_NOSYS[1], mu_phi_sorted_NOSYS[1], mu_e_sorted_NOSYS[1])"

  # create_tlorentz_vectors_for: ["el"] # desabilitado: el_tlv_NOSYS definido manualmente acima
  use_rvec: False # Use ROOT::RVec instead of std::vector.
  number_of_cpus: 4 # CPU cores to use for the analysis.
  use_region_subfolders: False # Save the histograms in subfolders per region.  it was true

regions: # All the regions (defined by a selection criteria) to be used in the analysis.
  - name: all_loose_muons # This postfix will be appended to every variable.
    selection: "pass_mujet_NOSYS == 1" # Selection string, needs to be valid C++ syntax.
    variables:
      &common_muons # Here you list the variables. Note the usage of the anchor (&). This allows you to reuse the same variables in other regions.
      - name: mu0_pt # Name of the variable. This will result in 'mu_pssst_all_loose_muon'.
        title: "Muon p_{T}(0) [GeV]; p_{T} [MeV]; Events"
        definition: "mu0_tlv_NOSYS.Pt()"
        binning:
          min: 0
          max: 100000
          number_of_bins: 20
      - name: mu0_eta
        title: "Muon eta(0); mu_eta; Events"
        definition: "mu0_tlv_NOSYS.Eta()"
        binning:
          min: -3.0
          max: 3.0
          number_of_bins: 60
      - name: "n_muons"
        type: "unsigned long"
        title: "Number of Muons ; nMuons ; Events"
        definition: "nMuons_NOSYS"
        binning:
          min: -0.5
          max: 7.5
          number_of_bins: 8
      - name: "ratio_pt2cone20_mu0"
        title: "p_{T}^{cone20}/p_{T}; p_{T}^{cone20}/p_{T}; Events"
        definition: "mu_pt2cone20_sorted_NOSYS[0]/mu_pt_sorted_NOSYS[0]"
        binning:
          min: 0
          max: 1
          number_of_bins: 50
      - name: "ratio_topoetcone20_mu0"
        title: "topoetcone20/p_{T}; topoetcone20/p_{T}; Events"
        definition: "mu_topoetcone20_sorted_NOSYS[0]/mu_pt_sorted_NOSYS[0]"
        binning:
          min: 0
          max: 1
          number_of_bins: 50
      - name: "sumET"
        type: "float"
        title: "FCAL sum ET; FCAL-SumET; Events"
        definition: "fcal_sum_et"
        binning:
          min: 0
          max: 6
          number_of_bins: 60
      - name: mj1j2 # Name of the variable. This will result in 'mu_pssst_all_loose_muon'.
        title: "Mj1j2; Mj1j2 [GeV]; Events"
        definition: "(jetR4_tlv0_NOSYS + jetR4_tlv1_NOSYS).M()/1000"
        binning:
          min: 20
          max: 160
          number_of_bins: 20
      - name: "mjj_wcand_best4"
        title: "m_{jj}^{W cand} (best pair in 4 leading jets); m_{jj} [GeV]; Events"
        definition: "mjj_wcand_best4_NOSYS"
        binning:
          min: 20
          max: 160
          number_of_bins: 28
      - name: "mjj_wcand_best4_absdiff"
        title: "|m_{jj}^{W cand} - 80.4|; |#Delta m| [GeV]; Events"
        definition: "mjj_wcand_best4_absdiff_NOSYS"
        binning:
          min: 0
          max: 100
          number_of_bins: 25
      - name: "nJetsR4"
        type: "unsigned long"
        title: "Number of R=0.4 Jets ; nJetsR4 ; Events"
        definition: "nJetsR4_NOSYS"
        binning:
          min: -0.5
          max: 19.5
          number_of_bins: 20
      - name: "pTJet1R4"
        title: "p_{T} of R=0.4 Jet 1 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_pt_sorted_NOSYS[0]/1000"
        binning:
          min: 0
          max: 200
          number_of_bins: 20
      - name: "pTJet2R4"
        title: "p_{T} of R=0.4 Jet 2 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_pt_sorted_NOSYS[1]/1000"
        binning:
          min: 0
          max: 200
          number_of_bins: 20
      - name: "etaJet1R4"
        title: "Eta of R=0.4 Jet 1 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_eta_sorted_NOSYS[0]"
        binning:
          min: -2.4
          max: 2.4
          number_of_bins: 20
      - name: "etaJet2R4"
        title: "Eta of R=0.4 Jet 2 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_eta_sorted_NOSYS[1]"
        binning:
          min: -2.4
          max: 2.4
          number_of_bins: 20

  #include barrel region from electron in eta
  - name: "TREXET_1MU2JETS_CENTRAL_0_80_ISO"
    selection: >-
      trigPassed_HLT_mu4_L1MU3V ==1 &&
      fcal_sum_et > 0.063208 &&  pass_mujet_NOSYS == 1 && mu0_tlv_NOSYS.Pt() > 18000 &&       
      (abs(mu0_tlv_NOSYS.Eta())) < 2.5 && mu_pt2cone20_sorted_NOSYS[0]/mu0_tlv_NOSYS.Pt() < 0.32 && 
      mu_topoetcone20_sorted_NOSYS[0]/mu0_tlv_NOSYS.Pt() < 0.50  && nMuons_NOSYS == 1 &&
      nJetsR4_NOSYS >= 4 && jetR4_tlv0_NOSYS.Pt() > 35000 && jetR4_tlv1_NOSYS.Pt() > 35000  &&
      jetR4_tlv2_NOSYS.Pt() > 35000 && jetR4_tlv3_NOSYS.Pt() > 35000  &&
      (abs(jetR4_tlv0_NOSYS.Eta())) < 2.5 && (abs(jetR4_tlv1_NOSYS.Eta())) < 2.5 &&
      (abs(jetR4_tlv2_NOSYS.Eta())) < 2.5 && (abs(jetR4_tlv3_NOSYS.Eta())) < 2.5 &&
      pass_ejet_NOSYS == 0 && pass_ee_NOSYS == 0 && pass_emu_NOSYS == 0
    variables: *common_muons # Here we reuse the same variables defined in the first region using the anchor (&) and alias (*).

  - name: "TREXET_1MU2JETS_CENTRAL_0_80_NOISO"
    selection: >-
      trigPassed_HLT_mu4_L1MU3V ==1 &&
      fcal_sum_et > 0.063208 &&  pass_mujet_NOSYS == 1 && mu0_tlv_NOSYS.Pt() > 18000 &&       
      (abs(mu0_tlv_NOSYS.Eta())) < 2.5 && nJetsR4_NOSYS >= 4 && nMuons_NOSYS == 1 && 
      jetR4_tlv0_NOSYS.Pt() > 35000 && jetR4_tlv1_NOSYS.Pt() > 35000  &&
      jetR4_tlv2_NOSYS.Pt() > 35000 && jetR4_tlv3_NOSYS.Pt() > 35000  &&
      (abs(jetR4_tlv0_NOSYS.Eta())) < 2.5 && (abs(jetR4_tlv1_NOSYS.Eta())) < 2.5 &&
      (abs(jetR4_tlv2_NOSYS.Eta())) < 2.5 && (abs(jetR4_tlv3_NOSYS.Eta())) < 2.5 &&
      pass_ejet_NOSYS == 0 && pass_ee_NOSYS == 0 && pass_emu_NOSYS == 0
    variables: *common_muons # Reuse the common variables defined above.

ntuples: # Use this block to define the ntuples to be created.
  regions: # Only events passing the selection of one of the regions will be saved in the ntuple.
    - TREXET_1MU2JETS_CENTRAL_0_80_ISO
    - TREXET_1MU2JETS_CENTRAL_0_80_NOISO

  #selection: "nJets_NOSYS == 3" # You can alternatively define a selection for the ntuples.
  branches: # These branches will be saved in the ntuple.
    - .*_pt_NOSYS # You can use regular expressions. This will select e, mu and jet pt.

samples: # All the samples to be used in the analysis. mudo aqui depois para diff mu e electrons
  - name: "data" # Name given to the sample.
    dsids: [0] # For data, this is always 0.
    campaigns: ["2024"] # The corresponding campaing or campaigns.
    simulation_type: "data" # Type of simulation.

  - name: "ttHijing" # Another sample.
    dsids: [601589] # List of DSIDs for the sample.
    campaigns: ["mc23e"]
    simulation_type: "fullsim" # For MC samples we have a different simulation type.

  - name: "zmumu"
    dsids: [600646] # List of DSIDs for the sample.
    campaigns: ["mc23e"]
    simulation_type: "fullsim" # For MC samples we have a different simulation type.

