general:
  debug_level: DEBUG # Logger level
  input_filelist_path: "../metadata/filelist.txt" # Path to the metadata relative to fastframes directory
  input_sumweights_path: "../metadata/sum_of_weights.txt" # Path to the metadata relative to fastframes directory
  output_path_histograms: "../output_histograms_electrons_loose/" # Path to the output histograms relative to fastframes directory
  output_path_ntuples: "../output_ntuples/" # Path to the output ntuples relative to fastframes directory
  default_sumweights: "NOSYS" # Default sum of weights for the samples. This is used to calculate the scaling to the luminosity.
  default_event_weights: "weight_mc_NOSYS  * weight_mc_fcal_2lep " # Default event weights for the samples. This is used to calculate the scaling to the luminosity.
  default_reco_tree_name: "reco" # Name of the reco tree in the input files.
  xsection_files:
    # Location of the cross-section, k-factor, filter-efficiency medatada split per campaign.
    - files: ["/home/danbiajujumiguel/workspace/FFAnalysis/PMGxsecDB_mc23.txt"]
      campaigns: ["mc23e"]
  luminosity:
    # Luminosity for the campaigns
    mc23e: 0.00163 #
  automatic_systematics: False
  nominal_only: True # Run with/without systematics.
  config_define_after_custom_class: True
  define_custom_columns:
    # You can define new variables here. Use valid C++ syntax.
    - name: "nJetsR4_NOSYS"
      definition: "jetR4_pt_NOSYS[jetR4_pt_NOSYS >= 18000 &&
        jetR4_select_looseHI_NOSYS==true].size()"
    - name: "jetR4_sort_idx_NOSYS"
      definition: "ROOT::VecOps::Argsort(-jetR4_pt_NOSYS[jetR4_select_looseHI_NOSYS])"
    - name: "jetR4_pt_sorted_NOSYS"
      definition:
        "ROOT::VecOps::Take(jetR4_pt_NOSYS[jetR4_select_looseHI_NOSYS],
        jetR4_sort_idx_NOSYS)"
    - name: "jetR4_eta_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(jetR4_eta[jetR4_select_looseHI_NOSYS],
        jetR4_sort_idx_NOSYS)"
    - name: "jetR4_phi_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(jetR4_phi[jetR4_select_looseHI_NOSYS],
        jetR4_sort_idx_NOSYS)"
    - name: "jetR4_e_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(jetR4_e_NOSYS[jetR4_select_looseHI_NOSYS],
        jetR4_sort_idx_NOSYS)"
    - name: "jetR4_tlv0_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(jetR4_pt_sorted_NOSYS[0],
        jetR4_eta_sorted_NOSYS[0], jetR4_phi_sorted_NOSYS[0],
        jetR4_e_sorted_NOSYS[0])"
    - name: "jetR4_tlv1_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(jetR4_pt_sorted_NOSYS[1],
        jetR4_eta_sorted_NOSYS[1], jetR4_phi_sorted_NOSYS[1],
        jetR4_e_sorted_NOSYS[1])"
    - name: "nElectrons_NOSYS"
      definition: "el_pt_NOSYS[el_pt_NOSYS >= 18000 &&
        el_select_loose_HI_NOSYS==true].size()"
    - name: "el_sort_idx_NOSYS"
      definition: "ROOT::VecOps::Argsort(-el_pt_NOSYS[el_select_loose_HI_NOSYS])"
    - name: "el_pt_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(el_pt_NOSYS[el_select_loose_HI_NOSYS],
        el_sort_idx_NOSYS)"
    - name: "el_eta_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(el_eta[el_select_loose_HI_NOSYS], el_sort_idx_NOSYS)"
    - name: "el_phi_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(el_phi[el_select_loose_HI_NOSYS], el_sort_idx_NOSYS)"
    - name: "el_e_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(el_e_NOSYS[el_select_loose_HI_NOSYS],
        el_sort_idx_NOSYS)"
    - name: "el_charge_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(el_charge[el_select_loose_HI_NOSYS],
        el_sort_idx_NOSYS)"
    - name: "el_pt2cone20_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(el_pt2cone20[el_select_loose_HI_NOSYS],
        el_sort_idx_NOSYS)"
    - name: "el_topoetcone20_sorted_NOSYS"
      definition: "ROOT::VecOps::Take(el_topoetcone20[el_select_loose_HI_NOSYS],
        el_sort_idx_NOSYS)"
    - name: "el_tlv0_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(el_pt_sorted_NOSYS[0],
        el_eta_sorted_NOSYS[0], el_phi_sorted_NOSYS[0], el_e_sorted_NOSYS[0])"
    - name: "el_tlv1_NOSYS"
      definition: "ROOT::Math::PtEtaPhiEVector(el_pt_sorted_NOSYS[1],
        el_eta_sorted_NOSYS[1], el_phi_sorted_NOSYS[1], el_e_sorted_NOSYS[1])"
  # create_tlorentz_vectors_for: ["el"] # desabilitado: el_tlv_NOSYS definido manualmente acima
  use_rvec: False # Use ROOT::RVec instead of std::vector.
  number_of_cpus: 4 # CPU cores to use for the analysis.
  use_region_subfolders: False # Save the histograms in subfolders per region.  it was true

regions:
  # All the regions (defined by a selection criteria) to be used in the analysis.
  - name: all_loose_electron # This postfix will be appended to every variable.
    selection: "pass_ee_NOSYS == 1 && trigPassed_HLT_e15_loose_nogsf_ion_L1eEM15 == 1" # Selection string, needs to be valid C++ syntax.
    variables:
      # Here you list the variables. Note the usage of the anchor (&). This allows you to reuse the same variables in other regions.
      &common_electrons
      - name: el_pt1 # Name of the variable. This will result in 'el_pt_all_loose_electron'.
        title: "electron p_{T}(1) [GeV]; p_{T} [GeV]; Events"
        definition: "el_tlv0_NOSYS.Pt()/1000"
        binning:
          min: 0
          max: 200
          number_of_bins: 40
      - name: el_eta1
        title: "Electron eta(1); el_eta; Events"
        definition: "el_tlv0_NOSYS.Eta()"
        binning:
          min: -3.0
          max: 3.0
          number_of_bins: 60
      - name: el_pt2
        title: "Electron p_{T}(2) [GeV]; p_{T} [GeV]; Events"
        definition: "el_tlv1_NOSYS.Pt()/1000"
        binning:
          min: 0
          max: 200
          number_of_bins: 40
      - name: el_eta2
        title: "Electron eta(2); el_eta; Events"
        definition: "el_tlv1_NOSYS.Eta()"
        binning:
          min: -3
          max: 3.0
          number_of_bins: 60
      - name: "n_electrons"
        type: "unsigned long"
        title: "Number of Electrons ; nElectrons ; Events"
        definition: "nElectrons_NOSYS"
        binning:
          min: -0.5
          max: 7.5
          number_of_bins: 8
      - name: "el_charge"
        title: "Electron charge; el_charge; Events"
        definition: "el_charge"
        binning:
          min: -2
          max: 2.0
          number_of_bins: 4
      - name: "m_ee"
        title: "m_{ee} [GeV]; m_{ee} [GeV]; Events"
        definition: (el_tlv0_NOSYS+el_tlv1_NOSYS).M()/1000
        binning:
          min: 50
          max: 120
          number_of_bins: 100
      - name: "ratio_pt2cone20_el1"
        title: "p_{T}^{cone20}/p_{T}; p_{T}^{cone20}/p_{T}; Events"
        definition: "el_pt2cone20_sorted_NOSYS[0]/el_pt_sorted_NOSYS[0]"
        binning:
          min: 0
          max: 1
          number_of_bins: 50
      - name: "ratio_pt2cone20_el2"
        title: "p_{T}^{cone20}/p_{T}; p_{T}^{cone20}/p_{T}; Events"
        definition: "el_pt2cone20_sorted_NOSYS[1]/el_pt_sorted_NOSYS[1]"
        binning:
          min: 0
          max: 1
          number_of_bins: 50
      - name: "ratio_topoetcone20_el1"
        title: "topoetcone20/p_{T}; topoetcone20/p_{T}; Events"
        definition: "el_topoetcone20_sorted_NOSYS[0]/el_pt_sorted_NOSYS[0]"
        binning:
          min: 0
          max: 1
          number_of_bins: 50
      - name: "ratio_topoetcone20_el2"
        title: "topoetcone20/p_{T}; topoetcone20/p_{T}; Events"
        definition: "el_topoetcone20_sorted_NOSYS[1]/el_pt_sorted_NOSYS[1]"
        binning:
          min: 0
          max: 1
          number_of_bins: 50
      - name: "el1_pt2cone20"
        title: "p_{T}^{cone20} [GeV]; p_{T}^{cone20} [GeV]; Events"
        definition: "el_pt2cone20_sorted_NOSYS[0]/1000"
        binning:
          min: 0
          max: 20
          number_of_bins: 20
      - name: "el2_pt2cone20"
        title: "p_{T}^{cone20} [GeV]; p_{T}^{cone20} [GeV]; Events"
        definition: "el_pt2cone20_sorted_NOSYS[1]/1000.0"
        binning:
          min: 0
          max: 20
          number_of_bins: 20
      - name: "sumET"
        type: "float"
        title: "FCAL sum ET; FCAL-SumET; Events"
        definition: fcal_sum_et
        binning:
          min: 0
          max: 10
          number_of_bins: 100
      - name: "nJetsR4"
        type: "unsigned long"
        title: "Number of R=0.4 Jets ; nJetsR4 ; Events"
        definition: "nJetsR4_NOSYS"
        binning:
          min: -0.5
          max: 19.5
          number_of_bins: 20
      - name: "pTJet1R4"
        title: "p_{T} of R=0.4 Jet 1 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_pt_sorted_NOSYS[0]/1000"
        binning:
          min: 0
          max: 200
          number_of_bins: 20
      - name: "pTJet2R4"
        title: "p_{T} of R=0.4 Jet 2 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_pt_sorted_NOSYS[1]/1000.0"
        binning:
          min: 0
          max: 200
          number_of_bins: 20
      - name: "etaJet1R4"
        title: "Eta of R=0.4 Jet 1 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_eta_sorted_NOSYS[0]"
        binning:
          min: -2.4
          max: 2.4
          number_of_bins: 20
      - name: "etaJet2R4"
        title: "Eta of R=0.4 Jet 2 [GeV]; p_{T} [GeV]; Events"
        definition: "jetR4_eta_sorted_NOSYS[1]"
        binning:
          min: -2.4
          max: 2.4
          number_of_bins: 20

  #include barrel region from electron in eta
  - name: "TREXET_2EL_CENTRAL_0_80_ISO"
    selection: >-
      trigPassed_HLT_e15_loose_nogsf_ion_L1eEM15 ==1 && 
      pass_ee_NOSYS == 1 && nElectrons_NOSYS == 2 && fcal_sum_et > 0.063208 &&
      (abs(el_eta_sorted_NOSYS[0]) < 1.37 || (abs(el_eta_sorted_NOSYS[0]) > 1.52
      && abs(el_eta_sorted_NOSYS[0]) < 2.5)) && (abs(el_eta_sorted_NOSYS[1]) <
      1.37 || (abs(el_eta_sorted_NOSYS[1]) > 1.52 && abs(el_eta_sorted_NOSYS[1])
      < 2.47)) &&  el_charge_sorted_NOSYS[0] * el_charge_sorted_NOSYS[1] < 0 &&
      el_pt2cone20_sorted_NOSYS[0]/el_pt_sorted_NOSYS[0] < 0.16
      &&  el_pt2cone20_sorted_NOSYS[1]/el_pt_sorted_NOSYS[1] < 0.16 &&
      el_topoetcone20_sorted_NOSYS[0]/el_pt_sorted_NOSYS[0] < 0.22 &&
      el_topoetcone20_sorted_NOSYS[1]/el_pt_sorted_NOSYS[1] < 0.22 &&
      pass_mumu_NOSYS == 0 && pass_emu_NOSYS == 0
    variables: *common_electrons # Reuse the common variables defined above.

  - name: "TREXET_2EL_CENTRAL_0_80_NOISO"
    selection: >-
      trigPassed_HLT_e15_loose_nogsf_ion_L1eEM15 ==1 &&  
      pass_ee_NOSYS == 1 && nElectrons_NOSYS == 2 && fcal_sum_et > 0.063208 &&
      (abs(el_eta_sorted_NOSYS[0]) < 1.37 || (abs(el_eta_sorted_NOSYS[0]) > 1.52
      && abs(el_eta_sorted_NOSYS[0]) < 2.47)) && (abs(el_eta_sorted_NOSYS[1]) <
      1.37 || (abs(el_eta_sorted_NOSYS[1]) > 1.52 && abs(el_eta_sorted_NOSYS[1])
      < 2.47)) && pass_mumu_NOSYS == 0 && pass_emu_NOSYS == 0
    variables: *common_electrons # Reuse the common variables defined above.

cutflows:
  - name: "CutFlow_ee_loose_ttbar"
    variables_to_track:
      - m_ee # Reuse the common variables defined above.
    selections:
      - selection: "trigPassed_HLT_e15_loose_nogsf_ion_L1eEM15 == 1"
        title: "CF_Pass_Trigger"
      - selection: "pass_ee_NOSYS == 1 && nElectrons_NOSYS == 2"
        title: "CF_Pass_2el"
      - selection: "el_charge_sorted_NOSYS[0] * el_charge_sorted_NOSYS[1] < 0"
        title: "CF_Pass_2el_OppCharge"
      - selection: "pass_mumu_NOSYS == 0 && pass_emu_NOSYS == 0"
        title: "CF_Pass_ee_emu_veto"
      - selection: "abs(el_eta_sorted_NOSYS[0]) < 2.5 && abs(el_eta_sorted_NOSYS[1]) < 2.5 && el_pt_sorted_NOSYS[0] > 18000 && el_pt_sorted_NOSYS[1] > 18000"
        title: "CF_Pass_Eta_Pt"
      - selection: "fcal_sum_et > 0.063208"
        title: "CF_Pass_FCAL"
      - selection: "el_pt2cone20_sorted_NOSYS[0]/el_pt_sorted_NOSYS[0] < 0.16 && el_pt2cone20_sorted_NOSYS[1]/el_pt_sorted_NOSYS[1] < 0.16 && el_topoetcone20_sorted_NOSYS[0]/el_pt_sorted_NOSYS[0] < 0.22 && el_topoetcone20_sorted_NOSYS[1]/el_pt_sorted_NOSYS[1] < 0.22"
        title: "CF_Pass_Iso"
      - selection: "nJetsR4_NOSYS >= 1"
        title: "CF_Pass_1Jets"

ntuples:
  # Use this block to define the ntuples to be created.
  regions:
    # Only events passing the selection of one of the regions will be saved in the ntuple.
    - TREXET_2EL_CENTRAL_0_80_ISO
    - TREXET_2EL_CENTRAL_0_80_NOISO

  branches:
    # These branches will be saved in the ntuple.
    - .*_pt_NOSYS # You can use regular expressions. This will select e, mu and jet pt.
    - el_eta
    - el_phi

samples:
  # All the samples to be used in the analysis. mudo aqui depois para diff mu e electrons
  - name: "data" # Name given to the sample.
    dsids: [0] # For data, this is always 0.
    campaigns: ["2024"] # The corresponding campaing or campaigns.
    simulation_type: "data" # Type of simulation.

  - name: "ttHijing" # Another sample.
    dsids: [601589] # List of DSIDs for the sample.
    campaigns: ["mc23e"]
    simulation_type: "fullsim" # For MC samples we have a different simulation type.

  - name: "zee" # Another sample.
    dsids: [601238] # List of DSIDs for the sample.
    campaigns: ["mc23e"]
    simulation_type: "fullsim" # For MC samples we have a different simulation type.
